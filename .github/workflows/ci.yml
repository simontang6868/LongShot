name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-stitchcore:
    name: StitchCore swift test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build & Test StitchCore
        working-directory: StitchCore
        run: swift test 2>&1 | tee ../test-output.log

      - name: Summarize
        if: always()
        run: |
          echo "LongShot StitchCore swift test @ $(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifact-summary.txt
          echo "runner: ${{ runner.os }}" >> artifact-summary.txt
          tail -n 8 test-output.log >> artifact-summary.txt

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stitchcore-test-artifacts
          path: |
            test-output.log
            artifact-summary.txt
          if-no-files-found: warn
